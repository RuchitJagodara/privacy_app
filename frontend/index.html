<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyGram - Privacy-Focused Social Media</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar" style="display: none;">
        <div class="nav-container">
            <div class="nav-brand">
                <h2>PrivacyGram</h2>
            </div>
            <div class="nav-links">
                <a href="#" onclick="showFeed()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                    Home
                </a>
                <a href="#" onclick="showNotifications()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    Notifications
                    <span class="notification-badge" id="notificationBadge" style="display: none;"></span>
                </a>
                <a href="#" onclick="showProfile()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    Profile
                </a>
                <a href="#" onclick="logout()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Logout
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <!-- Auth Page -->
        <div id="authPage" class="page">
            <div class="auth-container">
                <h1>PrivacyGram</h1>
                <p class="tagline">Share moments, respect privacy</p>
                
                <div class="auth-tabs">
                    <button class="tab-btn active" onclick="showLoginForm()">Login</button>
                    <button class="tab-btn" onclick="showRegisterForm()">Register</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form">
                    <input type="text" id="loginUsername" placeholder="Username" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <div id="loginError" class="error-message"></div>
                </form>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" style="display: none;">
                    <input type="text" id="registerUsername" placeholder="Username" required>
                    <input type="email" id="registerEmail" placeholder="Email" required>
                    <input type="text" id="registerFullName" placeholder="Full Name">
                    <input type="password" id="registerPassword" placeholder="Password" required>
                    <button type="submit">Register</button>
                    <div id="registerError" class="error-message"></div>
                </form>
            </div>
        </div>

        <!-- Main App Page -->
        <div id="mainPage" class="page" style="display: none;">
            <!-- Stories Section -->
            <div class="stories-container" id="storiesContainer">
                <div class="add-story-btn" onclick="showUploadModal('story')">
                    <div class="add-icon">+</div>
                    <span>Your Story</span>
                </div>
            </div>

            <!-- Upload Button -->
            <div class="upload-section">
                <button class="btn-primary" onclick="showUploadModal('post')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                    </svg>
                    Create Post
                </button>
            </div>

            <!-- Feed -->
            <div id="feedContainer" class="feed-container">
                <!-- Posts will be loaded here -->
            </div>

            <!-- Notifications Page -->
            <div id="notificationsPage" style="display: none;">
                <h2>Notifications</h2>
                <div id="notificationsList" class="notifications-list">
                    <!-- Notifications will be loaded here -->
                </div>
            </div>

            <!-- Profile Page -->
            <div id="profilePage" style="display: none;">
                <div class="profile-header">
                    <div class="profile-info">
                        <h2 id="profileUsername"></h2>
                        <p id="profileFullName"></p>
                        <button class="btn-secondary" onclick="showFaceRegistrationModal()">Register Your Face</button>
                    </div>
                </div>
                <div id="profilePosts" class="feed-container">
                    <!-- User's posts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeUploadModal()">&times;</span>
            <h2 id="uploadModalTitle">Create Post</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="image-upload-area" id="imageUploadArea">
                    <input type="file" id="imageInput" accept="image/*" required>
                    <label for="imageInput">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <p>Click to select image</p>
                    </label>
                    <img id="imagePreview" style="display: none;">
                </div>
                <textarea id="captionInput" placeholder="Write a caption..." rows="3"></textarea>
                <div id="uploadStatus" class="upload-status"></div>
                <button type="submit" class="btn-primary">Post</button>
            </form>
        </div>
    </div>

    <!-- Face Registration Modal -->
    <div id="faceRegModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeFaceRegModal()">&times;</span>
            <h2>Register Your Face</h2>
            <p>Upload a clear photo of your face for recognition</p>
            <form id="faceRegForm" enctype="multipart/form-data">
                <div class="image-upload-area">
                    <input type="file" id="faceImageInput" accept="image/*" required>
                    <label for="faceImageInput">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <p>Click to select face image</p>
                    </label>
                    <img id="faceImagePreview" style="display: none;">
                </div>
                <button type="submit" class="btn-primary">Register Face</button>
            </form>
        </div>
    </div>

    <!-- Approval Modal -->
    <div id="approvalModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeApprovalModal()">&times;</span>
            <h2>Pending Approvals</h2>
            <div id="approvalsList" class="approvals-list">
                <!-- Approvals will be loaded here -->
            </div>
        </div>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
